<?xml version="1.0" encoding="UTF-8"?>
<!--
  Buccellati Design System — Rigato Rule
  Horizontal divider band made of ~40 fine vertical hairlines, evoking the
  rigato engraving technique (parallel lines, silk-like sheen). Use as a
  section break beneath a slide title, never decoratively.
-->
