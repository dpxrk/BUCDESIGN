name: Regenerate .potx

on:
  push:
    branches: [main]
    paths:
      - 'powerpoint/**'
      - 'tokens/**'
      - 'assets/svg/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'powerpoint/**'
      - 'tokens/**'
      - 'assets/svg/**'
  workflow_dispatch:

jobs:
  build-potx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'powerpoint/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r powerpoint/requirements.txt

      - name: Generate .potx and sample .pptx
        working-directory: powerpoint
        run: python generate_potx.py

      - name: Verify outputs exist
        run: |
          test -f powerpoint/out/Buccellati_Executive.potx
          test -f powerpoint/out/Buccellati_Sample.pptx
          ls -la powerpoint/out/

      - name: Render sample .pptx to PDF (visual QA)
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice
          soffice --headless --convert-to pdf \
            --outdir powerpoint/out \
            powerpoint/out/Buccellati_Sample.pptx

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: buccellati-executive-${{ github.sha }}
          path: |
            powerpoint/out/Buccellati_Executive.potx
            powerpoint/out/Buccellati_Sample.pptx
            powerpoint/out/Buccellati_Sample.pdf
          retention-days: 30
